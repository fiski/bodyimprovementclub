<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Improvement Club</title>
<meta name="description" content="Body Improvement Club >>> enhancing muscle mass and celebrating all gains of life.">

<!-- Link preview. og:image MUST be absolute — scrapers do not resolve relative
     URLs, and GitHub Pages serves this project site from a /bodyimprovementclub
     subpath, so a root-relative path would 404. Update both the URLs here and
     the Pages settings together if the site ever moves to a custom domain.
     assets/og-image.png is rendered from og.html; see that file to regenerate.
     Facebook, LinkedIn and X cache a scrape aggressively — after changing the
     card, re-scrape the URL in each platform's debugger to see the new one. -->
<link rel="canonical" href="https://fiski.github.io/bodyimprovementclub/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Body Improvement Club">
<meta property="og:url" content="https://fiski.github.io/bodyimprovementclub/">
<meta property="og:title" content="Body Improvement Club">
<meta property="og:description" content="Body Improvement Club >>> enhancing muscle mass and celebrating all gains of life.">
<meta property="og:image" content="https://fiski.github.io/bodyimprovementclub/assets/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The BIC monogram above a brush-stroked box reading &quot;body improvement club&quot;, over a row of running, skipping, diet and weightlifting icons.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/fav-icon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Major+Mono+Display&display=swap">

<link rel="stylesheet" href="style.css">
</head>
<body>

<img class="grain" src="assets/film-grain.webp" alt="" aria-hidden="true" decoding="async">

<main class="stage">

  <img class="logo" src="assets/logo.svg" alt="Body Improvement Club" width="366" height="148">

  <!-- Desktop-only: the phone composition has no diet-bowl icon. -->
  <img class="i i--diet d-only" src="assets/diet-bowl.svg" alt="" aria-hidden="true">

  <div class="box box--title">
    <h1>body improvement club</h1>
  </div>

  <!-- Icon strips are a collage; per-icon offsets live in style.css so they can
       differ between the desktop and phone compositions. r5/r6 are the two
       extra runners the phone layout adds. -->
  <div class="box box--runners" aria-hidden="true">
    <img class="i run-l r1" src="assets/runner-large.svg" alt="">
    <img class="i run-s r2" src="assets/runner-small.svg" alt="">
    <img class="i run-l r3" src="assets/runner-large.svg" alt="">
    <img class="i run-s r4" src="assets/runner-small.svg" alt="">
    <img class="i run-l r5 m-only" src="assets/runner-large.svg" alt="">
    <img class="i run-s r6 m-only" src="assets/runner-small.svg" alt="">
  </div>

  <div class="panel">
    <div class="tagline">
      <p>Enhancing muscle mass and celebrating all gains of life</p>
    </div>
  </div>

  <div class="box box--exercises" aria-hidden="true">
    <img class="i rope j1"      src="assets/jump-rope.svg"    alt="">
    <img class="i rope j2 flip" src="assets/jump-rope.svg"    alt="">
    <img class="i lifter"       src="assets/weightlifter.svg" alt="">
    <img class="i rope j3 flip" src="assets/jump-rope.svg"    alt="">
    <img class="i rope j4"      src="assets/jump-rope.svg"    alt="">
  </div>

</main>

</body>
</html>
