<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Improvement Club</title>
<meta name="description" content="Body Improvement Club — enhancing muscle mass and celebrating all gains of life.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Major+Mono+Display&display=swap">

<link rel="stylesheet" href="style.css">
</head>
<body>

<img class="grain" src="assets/film-grain.webp" alt="" aria-hidden="true" decoding="async">

<main class="stage">

  <img class="logo" src="assets/logo.svg" alt="Body Improvement Club" width="366" height="148">

  <!-- Desktop-only: the phone composition has no diet-bowl icon. -->
  <img class="i i--diet d-only" src="assets/diet-bowl.svg" alt="" aria-hidden="true">

  <div class="box box--title">
    <h1>body improvement club</h1>
  </div>

  <!-- Icon strips are a collage; per-icon offsets live in style.css so they can
       differ between the desktop and phone compositions. r5/r6 are the two
       extra runners the phone layout adds. -->
  <div class="box box--runners" aria-hidden="true">
    <img class="i run-l r1" src="assets/runner-large.svg" alt="">
    <img class="i run-s r2" src="assets/runner-small.svg" alt="">
    <img class="i run-l r3" src="assets/runner-large.svg" alt="">
    <img class="i run-s r4" src="assets/runner-small.svg" alt="">
    <img class="i run-l r5 m-only" src="assets/runner-large.svg" alt="">
    <img class="i run-s r6 m-only" src="assets/runner-small.svg" alt="">
  </div>

  <div class="panel">
    <div class="tagline">
      <p>Enhancing muscle mass and celebrating all gains of life</p>
    </div>
  </div>

  <div class="box box--exercises" aria-hidden="true">
    <img class="i rope j1"      src="assets/jump-rope.svg"    alt="">
    <img class="i rope j2 flip" src="assets/jump-rope.svg"    alt="">
    <img class="i lifter"       src="assets/weightlifter.svg" alt="">
    <img class="i rope j3 flip" src="assets/jump-rope.svg"    alt="">
    <img class="i rope j4"      src="assets/jump-rope.svg"    alt="">
  </div>

</main>

</body>
</html>
