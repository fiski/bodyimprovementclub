<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIC - Interactive Tee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#D8CCBC; --red:#E30B19; --blue:#5C7CFF; --ink:#1c1a17; }
  *{box-sizing:border-box}
  /* Transparent, so when this page is the shop tee's iframe the paper and film
     grain behind it read straight through the alpha:true canvas. */
  html,body{margin:0;height:100%;background:transparent;font-family:'Overpass Mono',ui-monospace,Menlo,Consolas,monospace;}
  /* Tee left, panel right. The panel is a flex sibling of the canvas rather
     than pinned over it -- as an overlay it covered better than half the shirt
     once this page became a 366rem-wide iframe. */
  #bic-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px;}
  #viewwrap{position:relative;flex:0 1 auto;height:100%;aspect-ratio:1/1;min-width:0;}
  canvas#tshirt-viewer{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
  canvas#tshirt-viewer:active{cursor:grabbing;}
  /* max-height + a scrolling #rows so the panel can never outgrow the iframe,
     which cannot scroll (scrolling="no") and would just clip it. */
  #panel{flex:0 0 auto;width:210px;max-height:100%;display:flex;flex-direction:column;background:var(--paper);
    border:2px solid var(--red);box-shadow:5px 5px 0 -2px var(--paper),7px 7px 0 -2px var(--red);
    color:var(--red);font-size:11px;letter-spacing:.06em;z-index:10;user-select:none;}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--red);font-weight:700;}
  .ph button{background:var(--red);color:var(--paper);border:0;width:20px;height:20px;cursor:pointer;font-family:inherit;font-size:13px;line-height:1;}
  #rows{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;}
  /* display:flex above outranks the UA's [hidden]{display:none}, so without
     this the collapse button toggled the attribute and nothing moved. */
  #rows[hidden]{display:none;}
  #rows label{display:flex;justify-content:space-between;margin-top:8px;text-transform:uppercase;}
  #rows label span{color:var(--ink);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--red);margin:4px 0 2px;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--red);border:2px solid var(--paper);border-radius:0;cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--red);border:2px solid var(--paper);border-radius:0;cursor:pointer;}
  .toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .toggles button{flex:1;min-width:60px;background:var(--paper);color:var(--red);border:1px solid var(--red);padding:5px 4px;font-family:inherit;font-size:10px;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;}
  .toggles button.on{background:var(--red);color:var(--paper);}
  /* No room for two columns at the shop stage's phone width, so the panel
     drops below the tee and starts collapsed (see the matchMedia call at the
     end of the module). Expanding scrolls inside #rows instead of pushing the
     shirt out of an iframe that cannot scroll. */
  @media(max-width:520px){
    #bic-stage{flex-direction:column;gap:6px;padding:4px;}
    #viewwrap{flex:1 1 auto;height:auto;width:100%;aspect-ratio:auto;min-height:0;}
    #panel{width:100%;}
    #rows{max-height:38vh;overflow-y:auto;}
  }
</style>
</head><body>

<div id="bic-stage">
  <div id="viewwrap"><canvas id="tshirt-viewer"></canvas></div>
  <div id="panel">
    <div class="ph"><span>BIC · CONTROLS</span><button id="tog" aria-label="collapse">-</button></div>
    <div id="rows">
      <label>THICKNESS <span data-v="thick"></span></label>
      <input type="range" id="thick" min="0.4" max="3" step="0.05" value="1">
      <label>SPIN SPEED <span data-v="speed"></span></label>
      <input type="range" id="speed" min="0" max="6" step="0.1" value="1.2">
      <label>PULSE <span data-v="pulse"></span></label>
      <input type="range" id="pulse" min="0" max="0.25" step="0.005" value="0">
      <label>PULSE RATE <span data-v="pulseRate"></span></label>
      <input type="range" id="pulseRate" min="0.2" max="6" step="0.1" value="2">
      <label>DISTORT <span data-v="distort"></span></label>
      <input type="range" id="distort" min="0" max="0.4" step="0.005" value="0">
      <label>DISTORT RATE <span data-v="distRate"></span></label>
      <input type="range" id="distRate" min="0.2" max="6" step="0.1" value="1.5">
      <label>DETAIL <span data-v="detail"></span></label>
      <input type="range" id="detail" min="1" max="60" step="1" value="45">
      <div class="toggles">
        <button id="ghost" class="on">GHOST</button>
        <button id="spin" class="on">AUTO-SPIN</button>
        <button id="reset">RESET</button>
      </div>
    </div>
  </div>
</div>

const U={ uTime:{value:0}, uDistort:{value:0}, uDistortFreq:{value:1.5} };
function distortMat(color,opacity){
  const m=new LineMaterial({color,linewidth:1,transparent:opacity<1,opacity,alphaToCoverage:true});
  m.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uDistort=U.uDistort; sh.uniforms.uDistortFreq=U.uDistortFreq;
    sh.vertexShader='uniform float uTime;uniform float uDistort;uniform float uDistortFreq;\n'+
      'vec3 disp(vec3 p){float d=uDistort;p.x+=sin(p.y*uDistortFreq+uTime)*d;p.y+=sin(p.z*uDistortFreq+uTime*1.1)*d;p.z+=sin(p.x*uDistortFreq+uTime*0.9)*d;return p;}\n'+
      sh.vertexShader
        .replace('vec4 start = modelViewMatrix * vec4( instanceStart, 1.0 );','vec4 start = modelViewMatrix * vec4( disp(instanceStart), 1.0 );')
        .replace('vec4 end = modelViewMatrix * vec4( instanceEnd, 1.0 );','vec4 end = modelViewMatrix * vec4( disp(instanceEnd), 1.0 );');
  };
  return m;
}

let sourceGeo=[], group=new THREE.Group(), ghostOn=true, detail=45;
scene.add(group);

new GLTFLoader().parse(b64ToBuf(MODEL_B64),'',(g)=>{
  g.scene.traverse(c=>{ if(c.isMesh){ c.updateWorldMatrix(true,false); sourceGeo.push({geo:c.geometry,mat:c.matrixWorld.clone()}); }});
  rebuild(); center();
});
function rebuild(){
  group.clear();
  sourceGeo.forEach(({geo,mat})=>{
    const eg=new THREE.EdgesGeometry(geo,detail);
    const seg=new LineSegmentsGeometry(); seg.setPositions(eg.attributes.position.array);
    if(ghostOn){const gh=new LineSegments2(seg,ghostMat);gh.applyMatrix4(mat);gh.position.x-=.03;gh.position.y+=.03;group.add(gh);}
    const ln=new LineSegments2(seg,redMat); ln.applyMatrix4(mat); group.add(ln);
  });
}
function center(){const b=new THREE.Box3().setFromObject(group),c=b.getCenter(new THREE.Vector3());group.position.set(-c.x,-c.y,-c.z);}

// ---- wire up controls ----
const $=id=>document.getElementById(id);
const show=()=>document.querySelectorAll('[data-v]').forEach(s=>{const el=$(s.dataset.v);if(el)s.textContent=(+el.value).toFixed(2);});
let pulseAmt=0, pulseRate=2;
function bind(id,fn){const el=$(id);el.addEventListener('input',()=>{fn(+el.value);show();});}
bind('thick',v=>mats.forEach(m=>m.linewidth=v));
bind('speed',v=>controls.autoRotateSpeed=v);
bind('pulse',v=>pulseAmt=v);
bind('pulseRate',v=>pulseRate=v);
bind('distort',v=>U.uDistort.value=v);
bind('distRate',v=>U.uDistortFreq.value=v);
let dt;
bind('detail',v=>{detail=v;clearTimeout(dt);dt=setTimeout(()=>{rebuild();center();},120);});
$('ghost').onclick=e=>{ghostOn=!ghostOn;e.target.classList.toggle('on',ghostOn);rebuild();center();};
$('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.classList.toggle('on',controls.autoRotate);};
$('reset').onclick=()=>{const d={thick:1,speed:1.2,pulse:0,pulseRate:2,distort:0,distRate:1.5,detail:45};for(const k in d){$(k).value=d[k];$(k).dispatchEvent(new Event('input'));}};
$('tog').onclick=()=>{const r=$('rows');r.hidden=!r.hidden;$('tog').textContent=r.hidden?'+':'-';};
show();
// Stacked layout: open sliders would take the shirt's room on load.
if(matchMedia('(max-width:520px)').matches){$('rows').hidden=true;$('tog').textContent='+';}

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();setRes();}
window.addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(); U.uTime.value=t;
  const s=1+Math.sin(t*pulseRate)*pulseAmt; group.scale.setScalar(s);
  controls.update(); renderer.render(scene,camera);
});
</script>
